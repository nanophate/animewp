name: Private verification artifact triage
on:
  push:
    branches: [codex/public-readiness-audit]
    paths:
      - .github/workflows/public-artifact-triage.yml
      - tests/security/public-artifact-triage.py
permissions:
  contents: read
jobs:
  old-verification-findings:
    if: github.repository == 'nanophate/animewp' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read the reviewed triage program
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          show-progress: false
      - name: Inspect only the two identified verification assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tests/security/public-artifact-triage.py --root "$RUNNER_TEMP/animewp-public-audit-artifact-triage"
      - name: Preserve only structural evidence and redacted locations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-artifact-triage-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/animewp-public-audit-artifact-triage/report/*.json
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Remove private material after interruption
        if: always()
        run: python3 tests/security/public-history-audit.py cleanup --root "$RUNNER_TEMP/animewp-public-audit-artifact-triage"
