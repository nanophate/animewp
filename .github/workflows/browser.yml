name: Browser and real ZIP upgrades

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref for release verification
        type: string
        required: false
        default: ""

permissions:
  contents: read

# No shared Actions cache is needed; deny access even to executed build code.
cache-mode: none

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            wordpress: "6.6-branch"
            php: "8.0"
          - browser: chromium
            wordpress: "7.1-branch"
            php: "8.3"
          - browser: firefox
            wordpress: "7.1-branch"
            php: "8.3"
          - browser: webkit
            wordpress: "7.1-branch"
            php: "8.3"
    env:
      ANIMEWP_BROWSER: ${{ matrix.browser }}
      ANIMEWP_WP_BRANCH: ${{ matrix.wordpress }}
      ANIMEWP_PHP_VERSION: ${{ matrix.php }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4; verified commit
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Build and package the exact sources under test
        run: |
          npm ci
          npm run build
          python3 scripts/package.py
          python3 tests/browser/prepare.py
      - name: Download and verify the published release to upgrade from
        env:
          GH_TOKEN: ${{ github.token }}
        # Runs no repository code: the version is read from style.css as text,
        # and the ZIPs are checked with coreutils against the release's SHA256SUMS.
        run: |
          # The newest stable release not newer than this source: the previous
          # release for a version bump, otherwise the current one's ZIPs.
          current=$(sed -n 's/^Version: \([0-9][0-9.]*\)$/\1/p' themes/animewp/style.css)
          baseline=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
            | while read -r v; do [ "$(printf '%s\n%s\n' "$v" "$current" | sort -V | tail -n 1)" = "$current" ] && echo "$v"; done \
            | sort -V | tail -n 1)
          if [ -z "$baseline" ]; then echo "No published release at or below $current to upgrade from" >&2; exit 1; fi
          echo "Upgrading from $baseline"
          gh release download "v$baseline" --repo "$GITHUB_REPOSITORY" --dir artifacts/browser-fixtures --pattern "animewp-$baseline.zip" --pattern "animewp-blocks-$baseline.zip" --pattern SHA256SUMS
          cd artifacts/browser-fixtures
          grep -E "^[0-9a-f]{64}  (animewp|animewp-blocks)-$baseline\.zip$" SHA256SUMS > baseline.sha256
          test "$(wc -l < baseline.sha256)" -eq 2
          sha256sum --check --strict baseline.sha256
          echo "$baseline" > baseline-version.txt
      - name: Install the browser engine and system dependencies
        run: npx --no-install playwright install --with-deps "$ANIMEWP_BROWSER"
      - name: Install a vertical Japanese font for cross-browser glyph coverage
        run: |
          # Playwright's base dependencies install IPA Gothic and Unicode
          # fallback fonts, but vertical kanji glyph metrics differ between
          # Chromium, Firefox and WebKit without the full Noto CJK family.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\\n' 'Noto Sans CJK JP'
      - name: Prefetch Docker Official Images for isolated WordPress
        run: sh scripts/ci/prefetch-images.sh mariadb:lts phpmyadmin:latest "wordpress:php${ANIMEWP_PHP_VERSION}" "wordpress:cli-php${ANIMEWP_PHP_VERSION}"
      - name: Start an isolated WordPress site
        env:
          DOCKER_BUILDKIT: "0"
        run: npx --no-install wp-env start
      - name: Replace old ZIPs and verify saved content and settings
        run: sh tests/browser/setup.sh
      - name: Browser, editor and native update UI checks
        run: npx --no-install playwright test --config tests/browser/playwright.config.js
      - name: Save screenshots and sanitized results (no traces or session data)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.wordpress }}-php${{ matrix.php }}
          path: artifacts/browser-results/
          # A failed-job rerun replaces only this run's temporary QA artifact.
          overwrite: true
          if-no-files-found: warn
          retention-days: 14
