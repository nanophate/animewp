name: Browser and real ZIP upgrades

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref for release verification
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            wordpress: "6.6-branch"
            php: "8.0"
          - browser: chromium
            wordpress: "7.1-branch"
            php: "8.3"
          - browser: firefox
            wordpress: "7.1-branch"
            php: "8.3"
          - browser: webkit
            wordpress: "7.1-branch"
            php: "8.3"
    env:
      ANIMEWP_BROWSER: ${{ matrix.browser }}
      ANIMEWP_WP_BRANCH: ${{ matrix.wordpress }}
      ANIMEWP_PHP_VERSION: ${{ matrix.php }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified commit
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Build and package the exact sources under test
        run: |
          npm ci
          npm run build
          python3 scripts/package.py
          python3 tests/browser/prepare.py
      - name: Download and verify the existing 1.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.0 --repo "$GITHUB_REPOSITORY" --dir artifacts/browser-fixtures --pattern animewp-1.3.0.zip --pattern animewp-blocks-1.3.0.zip --pattern SHA256SUMS
          python3 tests/browser/verify-baseline.py
      - name: Install the browser engine and system dependencies
        run: npx --no-install playwright install --with-deps "$ANIMEWP_BROWSER"
      - name: Start an isolated WordPress site
        run: npx --no-install wp-env start
      - name: Replace old ZIPs and verify saved content and settings
        run: sh tests/browser/setup.sh
      - name: Browser, editor and native update UI checks
        run: npx --no-install playwright test --config tests/browser/playwright.config.js
      - name: Save screenshots and sanitized results (no traces or session data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.wordpress }}-php${{ matrix.php }}
          path: artifacts/browser-results/
          # A failed-job rerun replaces only this run's temporary QA artifact.
          overwrite: true
          if-no-files-found: warn
          retention-days: 14
