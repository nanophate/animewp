name: Dependency security audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref for release verification
        type: string
        required: false
        default: ""
  schedule:
    # Daily at 04:23 Asia/Tokyo (19:23 UTC).
    - cron: "23 19 * * *"

permissions:
  contents: read

# No shared Actions cache is needed; deny access even to executed build code.
cache-mode: none

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      # Release recovery can verify an older main-derived tag. Never pass the
      # workflow_call input to actions/checkout or fetch an input-controlled ref.
      - name: Select verified release source
        if: ${{ inputs.ref != '' }}
        env:
          AUDIT_SOURCE_SHA: ${{ inputs.ref }}
        run: |
          if [[ ! "$AUDIT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Audit source must be a full commit SHA'
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$AUDIT_SOURCE_SHA" refs/remotes/origin/main; then
            echo '::error::Audit source must be an ancestor of main'
            exit 1
          fi
          git checkout --detach "$AUDIT_SOURCE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Verify audit failure handling and exception scope
        run: python3 -m unittest discover -s tests/security -p 'test_*.py'
      # Fails on any runtime vulnerability, and on high/critical development-tool
      # advisories not reviewed in tests/security/npm-audit-accepted.json.
      - name: Audit locked dependencies (root and tests/serialization)
        run: python3 tests/security/npm_audit.py . tests/serialization

  composer:
    name: Composer audit (tests/security)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Select verified release source
        if: ${{ inputs.ref != '' }}
        env:
          AUDIT_SOURCE_SHA: ${{ inputs.ref }}
        run: |
          if [[ ! "$AUDIT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Audit source must be a full commit SHA'
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$AUDIT_SOURCE_SHA" refs/remotes/origin/main; then
            echo '::error::Audit source must be an ancestor of main'
            exit 1
          fi
          git checkout --detach "$AUDIT_SOURCE_SHA"
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Audit locked dependencies, including security tooling
        working-directory: tests/security
        # Report abandoned packages separately from known vulnerabilities.
        run: composer --no-plugins --no-scripts audit --locked --abandoned=report --no-interaction
