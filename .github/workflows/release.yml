name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing main-derived tag to verify or resume (vX.Y.Z)
        type: string
        required: true
      publish:
        description: Recovery only - publish the Release and propose the feed PR
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Serializes main pushes, tag pushes and recovery. Tags created with GITHUB_TOKEN
# do not trigger another push run; stage and publish complete in this same run.
concurrency:
  group: animewp-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'nanophate/animewp' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name != 'push' || !github.event.deleted)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      tool_sha: ${{ steps.source.outputs.tool_sha }}
      version: ${{ steps.source.outputs.version }}
      skip: ${{ steps.source.outputs.skip }}
      create_tag: ${{ steps.source.outputs.create_tag }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - name: Check out main and its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release event without writing tags or assets
        id: source
        run: python3 scripts/release_automation.py resolve --github-output "$GITHUB_OUTPUT"

  source-checks:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  dependency-audit:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/dependency-audit.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  browser-checks:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/browser.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  package:
    needs: [resolve, source-checks, dependency-audit, browser-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Build and validate both installation archives
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          CREATE_TAG: ${{ needs.resolve.outputs.create_tag }}
        run: |
          npm ci
          npm run build
          python3 scripts/package.py
          python3 scripts/release.py prepare --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --create-tag "$CREATE_TAG"
      - name: Preserve the complete verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.resolve.outputs.sha }}
          path: artifacts/release-candidate/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the reviewed main publishing tool without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tool_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve this run's verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.resolve.outputs.sha }}
          path: artifacts/release-candidate/
      - name: Stage immutable assets then publish and propose the feed PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TOOL_SHA: ${{ needs.resolve.outputs.tool_sha }}
          PUBLISH: ${{ needs.resolve.outputs.publish }}
        run: python3 scripts/release_automation.py publish --candidate artifacts/release-candidate --publish "$PUBLISH"
