name: Source and package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified commit
        with:
          persist-credentials: false
      - name: PHP syntax on the target runtime
        env:
          ANIMEWP_PHP_VERSION: ${{ matrix.php }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "php:${ANIMEWP_PHP_VERSION}-cli" sh -eu -c 'find themes plugins tests -type f -name "*.php" -print0 | xargs -0 -n 1 php -l'
      - name: JavaScript, Python, JSON, metadata, audit and reproducibility
        run: python3 scripts/validate.py --skip-php
      - name: Produce and verify installation ZIPs
        run: |
          python3 scripts/package.py
          cd artifacts/releases
          sha256sum --check SHA256SUMS
