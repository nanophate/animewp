name: Source and package checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays at 04:37 Asia/Tokyo (Sunday 19:37 UTC).
    - cron: "37 19 * * 0"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4; verified commit
        with:
          persist-credentials: false
          # The serialization check compares against main.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: PHP syntax on the target runtime
        env:
          ANIMEWP_PHP_VERSION: ${{ matrix.php }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "php:${ANIMEWP_PHP_VERSION}-cli" sh -eu -c 'find themes plugins tests -path "*/node_modules" -prune -o -type f -name "*.php" -print0 | xargs -0 -n 1 php -l'
      - name: Install build and test tooling
        run: |
          npm ci
          npm ci --prefix tests/serialization
      - name: Lint block source
        run: npm run lint:js
      - name: Build, JavaScript, Python, JSON, metadata, audit and reproducibility
        run: python3 scripts/validate.py --skip-php
      - name: Saved block markup is unchanged (WordPress 6.6 and 7.1 editor scripts)
        run: |
          for branch in 6.6-branch 7.1-branch; do
            ANIMEWP_WP_DIR="$(sh tests/serialization/fetch-wordpress.sh "$branch")" node tests/serialization/compare.js --base-ref origin/main
          done
      - name: Generated examples are current and valid
        run: ANIMEWP_WP_DIR="$(sh tests/serialization/fetch-wordpress.sh 6.6-branch)" node scripts/build-examples.js --check
      - name: Produce and verify installation ZIPs
        run: |
          python3 scripts/package.py
          cd artifacts/releases
          sha256sum --check SHA256SUMS

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.6-branch"
            php: "8.0"
          - wordpress: "7.1-branch"
            php: "8.3"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4; verified commit
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Install build tooling
        run: npm ci
      - name: Build blocks
        run: npm run build
      - name: Configure the WordPress and PHP test versions
        env:
          ANIMEWP_WP_BRANCH: ${{ matrix.wordpress }}
          ANIMEWP_PHP_VERSION: ${{ matrix.php }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('.wp-env.json')
          config = json.loads(path.read_text())
          config['core'] = 'WordPress/WordPress#' + os.environ['ANIMEWP_WP_BRANCH']
          config['phpVersion'] = os.environ['ANIMEWP_PHP_VERSION']
          path.write_text(json.dumps(config, indent=2) + '\n')
          PY
      - name: Start WordPress in Docker (wp-env)
        run: npx wp-env start
      - name: PHPCS security sniffs, Plugin Check and Theme Check
        run: npm run test:security
      - name: WordPress behavior and security regressions
        run: npm run test:wp
